{% if img_back_sm %}
<div x-data="{ flipped: false }" class="aspect-[63/88] relative">

  <button @click.prevent.stop="flipped = !flipped"
          class="absolute top-2 left-2 z-10 w-9 h-9 flex items-center justify-center
                 rounded-full bg-black/60 hover:bg-black/80 backdrop-blur-sm
                 shadow-lg transition-colors"
          :title="flipped ? 'Voltear — Untap' : 'Voltear — Tap'">
    <svg :class="flipped ? 'rotate-90' : 'rotate-0'"
         class="w-5 h-5 text-white transition-transform duration-300"
         fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
  </button>

  <div class="card-flip-container w-full h-full">
    <div class="card-flip-inner w-full h-full" :class="flipped ? 'flipped' : ''">
      <div class="card-flip-front">
        <img :src="cardSize === 'sm' ? '{{ img_sm }}' : cardSize === 'lg' ? '{{ img_lg }}' : '{{ img_md }}'"
             alt="{{ card_name }}" loading="{{ lazy }}"
             class="w-full h-full object-cover">
      </div>
      <div class="card-flip-back">
        <img :src="cardSize === 'sm' ? '{{ img_back_sm }}' : cardSize === 'lg' ? '{{ img_back_lg }}' : '{{ img_back_md }}'"
             alt="{{ card_name }} (back)" loading="{{ lazy }}"
             class="w-full h-full object-cover">
      </div>
    </div>
  </div>

</div>
{% elif img_sm %}
<div class="aspect-[63/88] bg-gray-100 dark:bg-void-800 overflow-hidden">
  <img :src="cardSize === 'sm' ? '{{ img_sm }}' : cardSize === 'lg' ? '{{ img_lg }}' : '{{ img_md }}'"
       alt="{{ card_name }}" loading="{{ lazy }}"
       class="w-full h-full object-cover transition-transform duration-200
              group-hover:scale-105">
</div>
{% else %}
<div class="aspect-[63/88] bg-gray-100 dark:bg-void-800
            flex items-center justify-center p-2">
  <span class="text-xs text-gray-400 dark:text-gray-600 text-center">
    {{ card_name }}
  </span>
</div>
{% endif %}
