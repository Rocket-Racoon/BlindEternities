<div id="set-progress" class="card p-4 mb-4"{% if hx_oob %} hx-swap-oob="true"{% endif %}>
  <div class="flex items-center justify-between mb-2">
    <div>
      <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Your Collection Progress</p>
      <p class="text-xs text-gray-500 mt-0.5">
        <span class="font-bold {% if completion_pct == 100 %}text-green-600 dark:text-green-400{% else %}text-void-600 dark:text-void-400{% endif %} tabular-nums">{{ total_owned_in_set }}</span>
        of {{ cardset.card_count }} cards owned
      </p>
    </div>
    <div class="text-right">
      <span class="text-2xl font-bold {% if completion_pct == 100 %}text-green-500{% else %}text-void-600 dark:text-void-400{% endif %} tabular-nums">{{ completion_pct|floatformat:0 }}%</span>
    </div>
  </div>
  <div class="h-2 rounded-full bg-gray-200 dark:bg-void-800 overflow-hidden">
    <div class="h-full {% if completion_pct == 100 %}bg-green-500{% else %}bg-void-500{% endif %} transition-all duration-500"
         style="width: {{ completion_pct|floatformat:2 }}%"></div>
  </div>
</div>
