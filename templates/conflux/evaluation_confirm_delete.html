{% extends "base.html" %}

{% block title %}Delete evaluation — Conflux{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
  <h1 class="text-xl font-semibold text-gray-900 dark:text-gray-100 mb-3">Delete this evaluation?</h1>
  <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">
    This removes the AI analysis and decklist snapshot. The original deck (if any) is untouched.
  </p>
  <form method="post" class="flex justify-end gap-2">
    {% csrf_token %}
    <a href="{% url 'conflux:evaluation-detail' object.pk %}"
       class="px-4 py-2 text-sm rounded-md border border-gray-200 dark:border-void-700 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-void-800">
      Cancel
    </a>
    <button type="submit"
            class="px-4 py-2 text-sm rounded-md bg-red-600 text-white hover:bg-red-700">
      Delete
    </button>
  </form>
</div>
{% endblock %}
