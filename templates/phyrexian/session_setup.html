{% extends "base.html" %}

{% block title %}New Game — {{ site_name }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto" x-data="sessionSetup()">

  <div class="mb-6">
    <a href="{% url 'phyrexian:dashboard' %}" class="text-sm text-void-600 dark:text-void-400 hover:underline">&larr; Dashboard</a>
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-gray-100 mt-1">Start a Game</h1>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Set up your live life counter.</p>
  </div>

  <form method="post" class="space-y-6">
    {% csrf_token %}

    <!-- Format & Starting Life -->
    <div class="card p-6">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-4">Game Settings</h2>
      <div class="grid md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Format</label>
          <select name="format" class="input" x-model="format" @change="updateLife()">
            {% for val, label in form.format.field.choices %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Players</label>
          <select name="player_count" class="input" x-model="playerCount" @change="updatePlayers()">
            <option value="2">2 Players</option>
            <option value="3">3 Players</option>
            <option value="4" selected>4 Players</option>
            <option value="5">5 Players</option>
            <option value="6">6 Players</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Starting Life</label>
          <input type="number" name="starting_life" class="input" x-model="startingLife" min="1" max="999">
        </div>
      </div>
    </div>

    <!-- Player Names -->
    <div class="card p-6">
      <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100 mb-4">Players</h2>
      <div class="space-y-3">
        <template x-for="(player, i) in players" :key="i">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full shrink-0 flex items-center justify-center text-white text-xs font-bold"
                 :style="`background-color: ${player.color}`"
                 x-text="i + 1"></div>
            <input type="text"
                   :name="`player_${i}_name`"
                   :placeholder="`Player ${i + 1}`"
                   x-model="player.name"
                   class="input flex-1">
            <input type="hidden" :name="`player_${i}_color`" :value="player.color">
            <!-- Color picker -->
            <div class="flex gap-1">
              <template x-for="c in colors" :key="c">
                <button type="button"
                        @click="player.color = c"
                        class="w-5 h-5 rounded-full border-2 transition-all"
                        :class="player.color === c ? 'border-gray-900 dark:border-white scale-110' : 'border-transparent opacity-60 hover:opacity-100'"
                        :style="`background-color: ${c}`"></button>
              </template>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Submit -->
    <div class="flex justify-end gap-3">
      <a href="{% url 'phyrexian:dashboard' %}"
         class="px-4 py-2 text-sm rounded-lg border border-gray-200 dark:border-void-700 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-void-800 transition-colors">
        Cancel
      </a>
      <button type="submit" class="btn-primary">Start Game</button>
    </div>
  </form>

</div>
{% endblock %}

{% block extra_js %}
<script>
  const FORMAT_LIFE = {{ format_life_map|safe }};
  const COLORS = {{ player_colors|safe }};

  function sessionSetup() {
    return {
      format: 'commander',
      playerCount: 4,
      startingLife: 40,
      colors: COLORS,
      players: Array.from({length: 4}, (_, i) => ({
        name: '', color: COLORS[i % COLORS.length]
      })),

      updateLife() {
        const life = FORMAT_LIFE[this.format];
        if (life) this.startingLife = life;
      },

      updatePlayers() {
        const count = parseInt(this.playerCount);
        while (this.players.length < count) {
          const i = this.players.length;
          this.players.push({name: '', color: COLORS[i % COLORS.length]});
        }
        while (this.players.length > count) {
          this.players.pop();
        }
      }
    };
  }
</script>
{% endblock %}
