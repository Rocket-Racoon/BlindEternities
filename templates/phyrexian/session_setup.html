{% extends "base.html" %}

{% block title %}New Game — {{ site_name }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto" x-data="sessionSetup()">

  <div class="mb-6">
    <a href="{% url 'phyrexian:dashboard' %}" class="text-sm text-void-600 dark:text-void-400 hover:underline">&larr; Dashboard</a>
    <h1 class="text-2xl font-semibold text-gray-900 dark:text-gray-100 mt-1">Start a Game</h1>
  </div>

  <form method="post" class="space-y-6">
    {% csrf_token %}

    <!-- Game Setup Section -->
    <div class="card p-6">
      <h2 class="text-sm uppercase tracking-wider text-gray-500 dark:text-gray-400 font-semibold mb-4">Game Setup</h2>

      <!-- Players (pill buttons) -->
      <div class="flex items-center gap-4 mb-5">
        <span class="text-sm text-gray-700 dark:text-gray-300 w-28">Players</span>
        <div class="flex gap-2">
          <template x-for="n in [2,3,4,5,6]" :key="n">
            <button type="button" @click="playerCount = n; updatePlayers()"
                    class="w-10 h-10 rounded-full text-sm font-bold transition-all"
                    :class="playerCount === n
                      ? 'bg-void-600 text-white ring-2 ring-void-400 ring-offset-2 dark:ring-offset-gray-900'
                      : 'bg-gray-200 dark:bg-void-700 text-gray-600 dark:text-gray-400 hover:bg-gray-300 dark:hover:bg-void-600'"
                    x-text="n"></button>
          </template>
        </div>
        <input type="hidden" name="player_count" :value="playerCount">
      </div>

      <!-- Starting Life (pill buttons) -->
      <div class="flex items-center gap-4 mb-5">
        <span class="text-sm text-gray-700 dark:text-gray-300 w-28">Starting Life</span>
        <div class="flex gap-2 flex-wrap">
          <template x-for="l in [20,25,30,40,60]" :key="l">
            <button type="button" @click="startingLife = l; customLife = false"
                    class="w-10 h-10 rounded-full text-sm font-bold transition-all"
                    :class="startingLife === l && !customLife
                      ? 'bg-void-600 text-white ring-2 ring-void-400 ring-offset-2 dark:ring-offset-gray-900'
                      : 'bg-gray-200 dark:bg-void-700 text-gray-600 dark:text-gray-400 hover:bg-gray-300 dark:hover:bg-void-600'"
                    x-text="l"></button>
          </template>
          <div class="flex items-center gap-1">
            <button type="button" @click="customLife = true"
                    class="px-3 h-10 rounded-full text-xs font-bold transition-all"
                    :class="customLife
                      ? 'bg-void-600 text-white ring-2 ring-void-400 ring-offset-2 dark:ring-offset-gray-900'
                      : 'bg-gray-200 dark:bg-void-700 text-gray-600 dark:text-gray-400 hover:bg-gray-300 dark:hover:bg-void-600'">
              Custom
            </button>
            <input x-show="customLife" x-transition type="number" x-model.number="startingLife"
                   class="w-16 input text-sm text-center" min="1" max="999">
          </div>
        </div>
      </div>
      <input type="hidden" name="starting_life" :value="startingLife">

      <!-- Format -->
      <div class="flex items-center gap-4">
        <span class="text-sm text-gray-700 dark:text-gray-300 w-28">Format</span>
        <select name="format" class="input flex-1" x-model="format" @change="updateLife()">
          {% for val, label in form.format.field.choices %}
          <option value="{{ val }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Players Section -->
    <div class="card p-6">
      <h2 class="text-sm uppercase tracking-wider text-gray-500 dark:text-gray-400 font-semibold mb-4">Players</h2>
      <div class="space-y-4">
        <template x-for="(player, i) in players" :key="i">
          <div class="rounded-xl border border-gray-200 dark:border-void-700">
            <!-- Player header with bg preview -->
            <div class="relative h-24 flex items-end p-3 rounded-t-xl overflow-hidden"
                 :style="player.bg
                   ? `background-image: url(${player.bg}); background-size: cover; background-position: center;`
                   : `background-color: ${player.color}22;`">
              <div class="absolute inset-0" :class="player.bg ? 'bg-black/30' : ''"></div>
              <div class="relative flex items-center gap-2 w-full">
                <div class="w-7 h-7 rounded-full border-2 border-white/80 flex items-center justify-center text-white text-xs font-bold"
                     :style="`background-color: ${player.color}`"
                     x-text="i + 1"></div>
                <!-- Player 0: current user (read-only) -->
                <template x-if="i === 0">
                  <span class="flex-1 text-sm font-semibold drop-shadow"
                        :class="player.bg ? 'text-white' : 'text-gray-900 dark:text-gray-100'"
                        x-text="player.name"></span>
                </template>
                <!-- Players 1+: friend autocomplete -->
                <template x-if="i > 0">
                  <div class="flex-1 relative">
                    <input type="text"
                           :id="`friend-search-${i}`"
                           x-model="player.friendQuery"
                           @input.debounce.300ms="searchFriend(i, player.friendQuery)"
                           @focus="if(player.friendResults?.length) player.friendOpen = true"
                           :placeholder="`Search friend or type name...`"
                           class="w-full bg-white/20 backdrop-blur-sm border border-white/20 rounded-lg text-sm font-semibold px-2 py-1 focus:ring-1 focus:ring-void-400 focus:border-void-400"
                           :class="player.bg ? 'text-white placeholder-white/50' : 'text-gray-900 dark:text-gray-100 placeholder-gray-400'">
                    <!-- Friend search results dropdown -->
                    <div x-show="player.friendOpen && player.friendResults?.length"
                         @click.away="player.friendOpen = false"
                         class="absolute top-full left-0 right-0 z-50 mt-1 rounded-lg shadow-xl max-h-48 overflow-y-auto
                                bg-white dark:bg-void-800 border border-gray-200 dark:border-void-600
                                ring-1 ring-black/5 dark:ring-white/10">
                      <template x-for="friend in player.friendResults" :key="friend.id">
                        <button type="button"
                                @click="selectFriend(i, friend)"
                                class="w-full flex items-center gap-3 px-3 py-2
                                       hover:bg-void-100 dark:hover:bg-void-700
                                       border-b border-gray-100 dark:border-void-700 last:border-b-0
                                       text-left text-sm transition-colors">
                          <div class="w-6 h-6 rounded-full bg-gray-300 dark:bg-void-600 overflow-hidden shrink-0">
                            <img x-show="friend.avatar" :src="friend.avatar" class="w-full h-full object-cover">
                          </div>
                          <span class="text-gray-900 dark:text-gray-100 font-medium truncate" x-text="friend.display_name"></span>
                          <span class="text-xs text-gray-400 truncate" x-text="'@' + friend.username"></span>
                        </button>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>

            <!-- Player settings -->
            <div class="p-3 bg-white dark:bg-void-900 space-y-3 rounded-b-xl">
              <!-- Hidden fields for form submission -->
              <input type="hidden" :name="`player_${i}_name`" :value="player.name">
              <input type="hidden" :name="`player_${i}_user`" :value="player.userId || ''">
              <input type="hidden" :name="`player_${i}_color`" :value="player.color">
              <input type="hidden" :name="`player_${i}_bg`" :value="player.bg">

              <!-- Color picker -->
              <div class="flex items-center gap-2">
                <span class="text-xs text-gray-500 w-16">Color</span>
                <div class="flex gap-1.5">
                  <template x-for="c in colors" :key="'c-'+i+'-'+c">
                    <button type="button" @click="player.color = c"
                            class="w-6 h-6 rounded-full border-2 transition-all"
                            :class="player.color === c ? 'border-gray-900 dark:border-white scale-110' : 'border-transparent opacity-60 hover:opacity-100'"
                            :style="`background-color: ${c}`"></button>
                  </template>
                </div>
              </div>

              <!-- Card art background search -->
              <div class="flex items-center gap-2">
                <span class="text-xs text-gray-500 w-16">Card Art</span>
                <div class="flex-1 relative">
                  <input type="text"
                         :id="`search-${i}`"
                         @input.debounce.300ms="searchCard(i, $event.target.value)"
                         @focus="if(searchResults[i]?.length && !versionPicker[i]) searchOpen = i"
                         :placeholder="player.bgName || 'Search card for background...'"
                         class="input text-xs w-full">
                  <!-- Clear button -->
                  <button x-show="player.bg" type="button"
                          @click="player.bg = ''; player.bgName = ''; saveBg(i, '', '')"
                          class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 text-xs">&times;</button>
                  <!-- Search results dropdown (card list) -->
                  <div x-show="searchOpen === i && searchResults[i]?.length && !versionPicker[i]"
                       @click.away="searchOpen = -1"
                       class="absolute top-full left-0 right-0 z-50 mt-1 rounded-lg shadow-xl max-h-56 overflow-y-auto
                              bg-white dark:bg-void-800 border border-gray-200 dark:border-void-600
                              ring-1 ring-black/5 dark:ring-white/10">
                    <template x-for="card in searchResults[i]" :key="card.id">
                      <button type="button"
                              @click="showVersions(i, card)"
                              class="w-full flex items-center gap-3 px-3 py-2.5
                                     hover:bg-void-100 dark:hover:bg-void-700
                                     border-b border-gray-100 dark:border-void-700 last:border-b-0
                                     text-left text-sm transition-colors">
                        <img :src="card.prints[0]?.art_crop || card.prints[0]?.image || ''"
                             class="w-14 h-10 rounded object-cover bg-gray-300 dark:bg-void-700 shrink-0"
                             :alt="card.name">
                        <div class="min-w-0 flex-1">
                          <span class="text-gray-900 dark:text-gray-100 font-medium truncate block" x-text="card.name"></span>
                          <span class="text-xs text-gray-500 dark:text-gray-400" x-text="`${card.prints.length} version${card.prints.length !== 1 ? 's' : ''}`"></span>
                        </div>
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                      </button>
                    </template>
                  </div>
                  <!-- Version picker dropdown (prints for a selected card) -->
                  <div x-show="searchOpen === i && versionPicker[i]"
                       @click.away="searchOpen = -1; versionPicker[i] = null"
                       class="absolute top-full left-0 right-0 z-50 mt-1 rounded-lg shadow-xl max-h-72 overflow-y-auto
                              bg-white dark:bg-void-800 border border-gray-200 dark:border-void-600
                              ring-1 ring-black/5 dark:ring-white/10">
                    <!-- Back button -->
                    <button type="button"
                            @click="versionPicker[i] = null"
                            class="w-full flex items-center gap-2 px-3 py-2 text-xs font-semibold text-void-600 dark:text-void-400
                                   bg-gray-50 dark:bg-void-900 border-b border-gray-200 dark:border-void-700
                                   hover:bg-gray-100 dark:hover:bg-void-800 sticky top-0">
                      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                      <span x-text="versionPicker[i]?.name"></span>
                    </button>
                    <template x-for="print in versionPicker[i]?.prints" :key="print.id">
                      <button type="button"
                              @click="selectBg(i, versionPicker[i].name, print)"
                              class="w-full flex items-center gap-3 px-3 py-2.5
                                     hover:bg-void-100 dark:hover:bg-void-700
                                     border-b border-gray-100 dark:border-void-700 last:border-b-0
                                     text-left text-sm transition-colors">
                        <img :src="print.art_crop || print.image || ''"
                             class="w-14 h-10 rounded object-cover bg-gray-300 dark:bg-void-700 shrink-0"
                             :alt="print.set_name">
                        <div class="min-w-0 flex-1">
                          <span class="text-gray-900 dark:text-gray-100 font-medium truncate block" x-text="print.set_name"></span>
                          <span class="text-xs text-gray-500 dark:text-gray-400">
                            <span x-text="print.set_code.toUpperCase()"></span>
                            <span class="mx-1">#</span>
                            <span x-text="print.collector_number"></span>
                          </span>
                        </div>
                      </button>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Deck link (dynamic per user) -->
              <div class="flex items-center gap-2">
                <span class="text-xs text-gray-500 w-16">Deck</span>
                <select :name="`player_${i}_deck`" class="input text-xs flex-1"
                        x-model="player.deck">
                  <option value="">— None —</option>
                  <template x-for="d in player.decks" :key="d.id">
                    <option :value="d.id" x-text="`${d.name} (${d.format})`"></option>
                  </template>
                </select>
                <span x-show="player.decksLoading" class="text-xs text-gray-400 shrink-0">Loading...</span>
              </div>

              <!-- Commander selection (only for commander format with no deck) -->
              <div x-show="format === 'commander' && !player.deck" x-cloak class="space-y-2 pt-1 border-t border-gray-100 dark:border-void-800">
                <div class="flex items-center gap-2">
                  <span class="text-xs text-gray-500 w-16">Commander</span>
                  <div class="flex-1 relative">
                    <input type="text"
                           x-model="player.commander1"
                           @input.debounce.300ms="searchCommander(i, 1, $event.target.value)"
                           @focus="if(player.cmdr1Results?.length) player.cmdr1Open = true"
                           placeholder="Commander name..."
                           class="input text-xs w-full">
                    <div x-show="player.cmdr1Open && player.cmdr1Results?.length"
                         @click.away="player.cmdr1Open = false"
                         class="absolute top-full left-0 right-0 z-50 mt-1 rounded-lg shadow-xl max-h-48 overflow-y-auto
                                bg-white dark:bg-void-800 border border-gray-200 dark:border-void-600
                                ring-1 ring-black/5 dark:ring-white/10">
                      <template x-for="card in player.cmdr1Results" :key="'c1-'+card.id">
                        <button type="button"
                                @click="selectCommander(i, 1, card.name)"
                                class="w-full flex items-center gap-2 px-3 py-1.5
                                       hover:bg-void-100 dark:hover:bg-void-700
                                       border-b border-gray-100 dark:border-void-700 last:border-b-0
                                       text-left text-xs transition-colors">
                          <img :src="card.prints[0]?.art_crop || card.prints[0]?.image || ''"
                               class="w-10 h-7 rounded object-cover bg-gray-300 dark:bg-void-700 shrink-0"
                               :alt="card.name">
                          <span class="text-gray-900 dark:text-gray-100 truncate" x-text="card.name"></span>
                        </button>
                      </template>
                    </div>
                  </div>
                </div>
                <div class="flex items-center gap-2 pl-[4.5rem]">
                  <label class="flex items-center gap-1.5 text-xs text-gray-500 cursor-pointer">
                    <input type="checkbox" x-model="player.hasPartner" class="rounded text-void-600 focus:ring-void-500">
                    <span>Has two commanders (partner)</span>
                  </label>
                </div>
                <div x-show="player.hasPartner" x-cloak class="flex items-center gap-2">
                  <span class="text-xs text-gray-500 w-16">Partner</span>
                  <div class="flex-1 relative">
                    <input type="text"
                           x-model="player.commander2"
                           @input.debounce.300ms="searchCommander(i, 2, $event.target.value)"
                           @focus="if(player.cmdr2Results?.length) player.cmdr2Open = true"
                           placeholder="Partner commander..."
                           class="input text-xs w-full">
                    <div x-show="player.cmdr2Open && player.cmdr2Results?.length"
                         @click.away="player.cmdr2Open = false"
                         class="absolute top-full left-0 right-0 z-50 mt-1 rounded-lg shadow-xl max-h-48 overflow-y-auto
                                bg-white dark:bg-void-800 border border-gray-200 dark:border-void-600
                                ring-1 ring-black/5 dark:ring-white/10">
                      <template x-for="card in player.cmdr2Results" :key="'c2-'+card.id">
                        <button type="button"
                                @click="selectCommander(i, 2, card.name)"
                                class="w-full flex items-center gap-2 px-3 py-1.5
                                       hover:bg-void-100 dark:hover:bg-void-700
                                       border-b border-gray-100 dark:border-void-700 last:border-b-0
                                       text-left text-xs transition-colors">
                          <img :src="card.prints[0]?.art_crop || card.prints[0]?.image || ''"
                               class="w-10 h-7 rounded object-cover bg-gray-300 dark:bg-void-700 shrink-0"
                               :alt="card.name">
                          <span class="text-gray-900 dark:text-gray-100 truncate" x-text="card.name"></span>
                        </button>
                      </template>
                    </div>
                  </div>
                </div>
                <input type="hidden" :name="`player_${i}_commander_1`" :value="player.commander1 || ''">
                <input type="hidden" :name="`player_${i}_commander_2`" :value="player.hasPartner ? (player.commander2 || '') : ''">
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Submit -->
    <div class="flex justify-end gap-3">
      <a href="{% url 'phyrexian:dashboard' %}"
         class="px-4 py-2 text-sm rounded-lg border border-gray-200 dark:border-void-700 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-void-800 transition-colors">
        Cancel
      </a>
      <button type="submit"
              class="px-6 py-2 text-sm rounded-lg bg-green-600 text-white hover:bg-green-700 transition-colors font-medium">
        Start Game
      </button>
    </div>
  </form>

</div>
{% endblock %}

{% block extra_js %}
<script>
  const FORMAT_LIFE = {{ format_life_map|safe }};
  const COLORS = {{ player_colors|safe }};
  const CURRENT_USER = {{ current_user_json|safe }};
  const CURRENT_USER_DECKS = {{ current_user_decks_json|safe }};
  const BG_STORAGE_KEY = 'session_setup_bg';

  function loadSavedBgs() {
    try { return JSON.parse(localStorage.getItem(BG_STORAGE_KEY)) || {}; }
    catch { return {}; }
  }

  function saveBg(idx, bg, bgName) {
    const saved = loadSavedBgs();
    if (bg) {
      saved[idx] = { bg, bgName };
    } else {
      delete saved[idx];
    }
    localStorage.setItem(BG_STORAGE_KEY, JSON.stringify(saved));
  }

  function makePlayer(i) {
    const saved = loadSavedBgs()[i] || {};
    const base = {
      bg: saved.bg || '',
      bgName: saved.bgName || '',
      deck: '',
      decksLoading: false,
      friendQuery: '',
      friendResults: [],
      friendOpen: false,
      commander1: '',
      commander2: '',
      hasPartner: false,
      cmdr1Results: [],
      cmdr1Open: false,
      cmdr2Results: [],
      cmdr2Open: false,
    };
    if (i === 0) {
      return {
        ...base,
        name: CURRENT_USER.name,
        userId: CURRENT_USER.id,
        color: COLORS[0],
        decks: CURRENT_USER_DECKS,
      };
    }
    return {
      ...base,
      name: '', userId: null,
      color: COLORS[i % COLORS.length],
      decks: [],
    };
  }

  function sessionSetup() {
    return {
      format: 'commander',
      playerCount: 4,
      startingLife: 40,
      customLife: false,
      colors: COLORS,
      players: Array.from({length: 4}, (_, i) => makePlayer(i)),
      searchResults: {},
      searchOpen: -1,
      versionPicker: {},

      updateLife() {
        const life = FORMAT_LIFE[this.format];
        if (life) { this.startingLife = life; this.customLife = false; }
      },

      updatePlayers() {
        const count = this.playerCount;
        while (this.players.length < count) {
          this.players.push(makePlayer(this.players.length));
        }
        while (this.players.length > count) this.players.pop();
      },

      // --- Friend search ---
      async searchFriend(idx, query) {
        const p = this.players[idx];
        if (!query || query.length < 1) {
          p.friendResults = [];
          p.friendOpen = false;
          // If they cleared the field, reset to text-only mode
          if (!query) {
            p.userId = null;
            p.name = '';
            p.decks = [];
            p.deck = '';
          }
          return;
        }
        // Update name to the raw text (for non-friend players)
        p.name = query;
        p.userId = null;
        p.decks = [];
        p.deck = '';
        try {
          const resp = await fetch(`/api/friend-search/?q=${encodeURIComponent(query)}`);
          const data = await resp.json();
          p.friendResults = data;
          p.friendOpen = data.length > 0;
        } catch(e) {
          console.error('Friend search failed:', e);
        }
      },

      async selectFriend(idx, friend) {
        const p = this.players[idx];
        p.name = friend.display_name;
        p.userId = friend.id;
        p.friendQuery = friend.display_name;
        p.friendResults = [];
        p.friendOpen = false;
        // Load friend's decks
        p.decksLoading = true;
        p.deck = '';
        try {
          const resp = await fetch(`/api/user-decks/${friend.id}/`);
          p.decks = await resp.json();
        } catch(e) {
          console.error('Failed to load decks:', e);
          p.decks = [];
        }
        p.decksLoading = false;
      },

      // --- Card search ---
      async searchCard(playerIdx, query) {
        if (query.length < 2) {
          this.searchResults[playerIdx] = [];
          this.versionPicker[playerIdx] = null;
          this.searchOpen = -1;
          return;
        }
        try {
          const resp = await fetch(`/collection/api/card-search/?q=${encodeURIComponent(query)}`);
          const data = await resp.json();
          this.searchResults[playerIdx] = data;
          this.versionPicker[playerIdx] = null;
          this.searchOpen = playerIdx;
        } catch(e) {
          console.error('Card search failed:', e);
        }
      },

      showVersions(idx, card) {
        if (card.prints.length === 1) {
          this.selectBg(idx, card.name, card.prints[0]);
        } else {
          this.versionPicker[idx] = card;
        }
      },

      selectBg(idx, cardName, print) {
        const bg = print.art_crop || print.image;
        this.players[idx].bg = bg;
        this.players[idx].bgName = cardName;
        saveBg(idx, bg, cardName);
        this.searchOpen = -1;
        this.versionPicker[idx] = null;
        const input = document.getElementById(`search-${idx}`);
        if (input) input.value = '';
      },

      // --- Commander search — only cards flagged as legal commanders ---
      async searchCommander(idx, slot, query) {
        const p = this.players[idx];
        const resultsKey = slot === 1 ? 'cmdr1Results' : 'cmdr2Results';
        const openKey = slot === 1 ? 'cmdr1Open' : 'cmdr2Open';
        if (!query || query.length < 2) {
          p[resultsKey] = [];
          p[openKey] = false;
          return;
        }
        try {
          const resp = await fetch(`/collection/api/card-search/?q=${encodeURIComponent(query)}&commander=1`);
          const data = await resp.json();
          p[resultsKey] = data;
          p[openKey] = data.length > 0;
        } catch(e) {
          console.error('Commander search failed:', e);
        }
      },

      selectCommander(idx, slot, name) {
        const p = this.players[idx];
        if (slot === 1) {
          p.commander1 = name;
          p.cmdr1Open = false;
          p.cmdr1Results = [];
        } else {
          p.commander2 = name;
          p.cmdr2Open = false;
          p.cmdr2Results = [];
        }
      }
    };
  }
</script>
{% endblock %}
