{% extends "base.html" %}

{% block title %}Delete Game Record — {{ site_name }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">

  <div class="card p-6">
    <h1 class="text-xl font-semibold text-gray-900 dark:text-gray-100 mb-4">Delete Game Record</h1>

    <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">
      Are you sure you want to delete this game record?
      <strong class="block mt-2 text-gray-800 dark:text-gray-200">{{ object }}</strong>
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="flex justify-end gap-3">
        <a href="{% url 'phyrexian:game-list' %}"
           class="px-4 py-2 text-sm rounded-lg border border-gray-200 dark:border-void-700 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-void-800 transition-colors">
          Cancel
        </a>
        <button type="submit"
                class="px-4 py-2 text-sm rounded-lg bg-red-600 text-white hover:bg-red-700 transition-colors">
          Delete
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
