{# HTMX partial: summary stat cards #}
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" id="dashboard-stats">
  <div class="card p-4 text-center">
    <p class="text-2xl font-bold text-void-600 dark:text-void-400">{{ total_decks }}</p>
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Decks</p>
  </div>
  <div class="card p-4 text-center">
    <p class="text-2xl font-bold text-void-600 dark:text-void-400">{{ total_collections }}</p>
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Collections</p>
  </div>
  <div class="card p-4 text-center">
    <p class="text-2xl font-bold text-void-600 dark:text-void-400">{{ total_games }}</p>
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Games Played</p>
  </div>
  <div class="card p-4 text-center">
    <p class="text-2xl font-bold text-green-600 dark:text-green-400">${{ total_collection_value|floatformat:2 }}</p>
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Collection Value</p>
  </div>
</div>
