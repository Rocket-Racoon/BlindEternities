{% load core_tags %}

<div x-data="cardAdder('{{ url }}')" class="space-y-4">
  <!-- Buscador de cartas -->
  <div class="relative">
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
      Buscar carta
    </label>
    <input type="text"
           x-model="query"
           @input.debounce.300ms="search()"
           @click.outside="results = []"
           placeholder="Nombre de la carta..."
           class="input w-full">

    <!-- Resultados de búsqueda -->
    <div x-show="results.length > 0"
         x-transition
         class="absolute z-20 mt-1 w-full bg-white dark:bg-void-800
                border border-gray-200 dark:border-void-700
                rounded-lg shadow-lg max-h-64 overflow-y-auto">
      <template x-for="card in results" :key="card.id">
        <button type="button"
                @click="selectCard(card)"
                class="w-full px-3 py-2 text-left hover:bg-gray-100
                       dark:hover:bg-void-700 flex items-center gap-3
                       border-b border-gray-100 dark:border-void-700 last:border-0">
          <template x-if="card.prints.length && card.prints[0].image">
            <img :src="card.prints[0].image"
                 :alt="card.name"
                 class="w-8 h-11 rounded object-cover shrink-0">
          </template>
          <div class="min-w-0">
            <p class="text-sm font-medium text-gray-900 dark:text-gray-100 truncate"
               x-text="card.name"></p>
            <p class="text-xs text-gray-500 dark:text-gray-400 truncate"
               x-text="card.type_line"></p>
          </div>
        </button>
      </template>
    </div>
  </div>

  <!-- Carta seleccionada -->
  <div x-show="selectedCard" x-transition class="space-y-4">
    <div class="flex gap-4 items-start p-3 rounded-lg bg-gray-50 dark:bg-void-800/50">
      <template x-if="selectedPrintImage">
        <img :src="selectedPrintImage" :alt="selectedCard?.name"
             class="w-16 h-22 rounded object-cover shrink-0">
      </template>
      <div class="min-w-0 flex-1">
        <p class="font-medium text-gray-900 dark:text-gray-100"
           x-text="selectedCard?.name"></p>
        <p class="text-xs text-gray-500 dark:text-gray-400"
           x-text="selectedCard?.type_line"></p>

        <!-- Selector de print -->
        <div x-show="selectedCard?.prints?.length > 1" class="mt-2">
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
            Edición
          </label>
          <select x-model="selectedPrintId"
                  @change="onPrintChange()"
                  class="input text-sm w-full">
            <template x-for="p in selectedCard?.prints || []" :key="p.id">
              <option :value="p.id"
                      x-text="`${p.set_name} #${p.collector_number}${p.price_usd ? ' — $' + p.price_usd : ''}`">
              </option>
            </template>
          </select>
        </div>
      </div>
      <button type="button" @click="clearSelection()"
              class="text-gray-400 hover:text-red-500 shrink-0">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Formulario de detalles -->
    <form :action="formUrl" method="post" class="space-y-3">
      {% csrf_token %}
      <input type="hidden" name="card" :value="selectedCard?.id">
      <input type="hidden" name="print" :value="selectedPrintId">

      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
            Cantidad
          </label>
          <input type="number" name="quantity" value="1" min="1"
                 class="input w-full text-sm">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
            Condición
          </label>
          <select name="condition" class="input w-full text-sm">
            {% for value, label in condition_choices %}
            <option value="{{ value }}" {% if value == "NM" %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
            Finish
          </label>
          <select name="finish" class="input w-full text-sm">
            {% for value, label in finish_choices %}
            <option value="{{ value }}" {% if value == "nonfoil" %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
            Idioma
          </label>
          <input type="text" name="language" value="en"
                 class="input w-full text-sm" placeholder="en">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
            Precio compra (USD)
          </label>
          <input type="number" name="purchase_price" step="0.01" min="0"
                 class="input w-full text-sm" placeholder="0.00">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">
            Notas
          </label>
          <input type="text" name="notes"
                 class="input w-full text-sm" placeholder="Opcional">
        </div>
      </div>

      <button type="submit"
              class="btn-primary text-sm">
        Agregar a la colección
      </button>
    </form>
  </div>
</div>

<script>
function cardAdder(url) {
  return {
    formUrl: url,
    query: '',
    results: [],
    selectedCard: null,
    selectedPrintId: '',
    selectedPrintImage: '',

    async search() {
      if (this.query.length < 2) {
        this.results = [];
        return;
      }
      try {
        const resp = await fetch(`{% url 'tolarian:card-search' %}?q=${encodeURIComponent(this.query)}`);
        this.results = await resp.json();
      } catch (e) {
        this.results = [];
      }
    },

    selectCard(card) {
      this.selectedCard = card;
      this.results = [];
      this.query = card.name;
      if (card.prints.length) {
        this.selectedPrintId = card.prints[0].id;
        this.selectedPrintImage = card.prints[0].image;
      } else {
        this.selectedPrintId = '';
        this.selectedPrintImage = '';
      }
    },

    onPrintChange() {
      const p = this.selectedCard?.prints?.find(p => p.id === this.selectedPrintId);
      this.selectedPrintImage = p?.image || '';
    },

    clearSelection() {
      this.selectedCard = null;
      this.selectedPrintId = '';
      this.selectedPrintImage = '';
      this.query = '';
    },
  };
}
</script>
