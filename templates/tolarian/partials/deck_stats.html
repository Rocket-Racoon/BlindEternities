<div class="space-y-3">
  <div class="flex justify-between text-sm">
    <span class="text-gray-500 dark:text-gray-400">Maindeck</span>
    <span class="font-medium text-gray-900 dark:text-gray-100">{{ main_count }}</span>
  </div>
  {% if side_count %}
  <div class="flex justify-between text-sm">
    <span class="text-gray-500 dark:text-gray-400">Sideboard</span>
    <span class="font-medium text-gray-900 dark:text-gray-100">{{ side_count }}</span>
  </div>
  {% endif %}
  <div class="flex justify-between text-sm">
    <span class="text-gray-500 dark:text-gray-400">Valor total</span>
    <span class="font-medium text-gray-900 dark:text-gray-100">
      ${{ total_value }} USD
    </span>
  </div>

  {% if shared %}
  <div class="pt-3 border-t border-gray-100 dark:border-void-800">
    <p class="text-xs font-medium text-gray-500 dark:text-gray-400
              uppercase tracking-wide mb-2">
      Cartas compartidas
    </p>
    <div class="space-y-1">
      {% for card_name, deck_names in shared.items %}
      <div class="text-xs">
        <span class="text-gray-700 dark:text-gray-300">{{ card_name }}</span>
        <span class="text-gray-400 dark:text-gray-600 ml-1">→ {{ deck_names|join:", " }}</span>
      </div>
      {% endfor %}
    </div>
  </div>
  {% endif %}
</div>
