<form action="{{ url }}" method="post" class="space-y-3">
  {% csrf_token %}
  <div>
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
      Lista de cartas
    </label>
    <textarea name="text"
              rows="10"
              class="input w-full font-mono text-sm"
              placeholder="4x Lightning Bolt
2 Counterspell (CMR) LP
1 Sol Ring (C21) NM foil
3x Swords to Plowshares etched"></textarea>
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
      Formato: <code>4x Nombre (SET) COND FINISH</code> &mdash;
      set, condici&oacute;n y finish son opcionales.
      Condiciones: NM, LP, MP, HP, DMG.
      Finish: foil, etched, glossy, surge, textured, etc.
      Default: NM nonfoil.
    </p>
  </div>
  <button type="submit" class="btn-primary text-sm">
    Agregar en lote
  </button>
</form>
