{% load core_tags %}

<div x-data="bulkCardAdder('{{ url }}', '{{ csrf_token }}')" class="space-y-4">
  <!-- Buscador de cartas -->
  <div class="relative">
    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
      Buscar carta
    </label>
    <input type="text"
           x-model="query"
           @input.debounce.300ms="search()"
           @click.outside="results = []"
           @keydown.escape="results = []"
           placeholder="Nombre de la carta..."
           class="input w-full">

    <!-- Resultados de búsqueda -->
    <div x-show="results.length > 0"
         x-transition
         class="absolute z-20 mt-1 w-full bg-white dark:bg-void-800
                border border-gray-200 dark:border-void-700
                rounded-lg shadow-lg max-h-64 overflow-y-auto">
      <template x-for="card in results" :key="card.id">
        <button type="button"
                @click="addCard(card)"
                class="w-full px-3 py-2 text-left hover:bg-gray-100
                       dark:hover:bg-void-700 flex items-center gap-3
                       border-b border-gray-100 dark:border-void-700 last:border-0">
          <template x-if="card.prints.length && card.prints[0].image">
            <img :src="card.prints[0].image"
                 :alt="card.name"
                 class="w-8 h-11 rounded object-cover shrink-0">
          </template>
          <div class="min-w-0">
            <p class="text-sm font-medium text-gray-900 dark:text-gray-100 truncate"
               x-text="card.name"></p>
            <p class="text-xs text-gray-500 dark:text-gray-400 truncate"
               x-text="card.type_line"></p>
          </div>
        </button>
      </template>
    </div>
  </div>

  <!-- Cola de cartas a agregar -->
  <div x-show="queue.length > 0" x-transition class="space-y-2">
    <div class="flex items-center justify-between">
      <h4 class="text-sm font-medium text-gray-700 dark:text-gray-300">
        Cartas a agregar (<span x-text="queue.length"></span>)
      </h4>
      <button type="button" @click="queue = []"
              class="text-xs text-red-500 hover:text-red-700 dark:hover:text-red-400">
        Limpiar todo
      </button>
    </div>

    <div class="border border-gray-200 dark:border-void-700 rounded-lg divide-y
                divide-gray-100 dark:divide-void-700 max-h-96 overflow-y-auto">
      <template x-for="(item, idx) in queue" :key="idx">
        <div class="px-3 py-2 flex items-center gap-3">
          <template x-if="item.image">
            <img :src="item.image" :alt="item.name"
                 class="w-8 h-11 rounded object-cover shrink-0">
          </template>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium text-gray-900 dark:text-gray-100 truncate"
               x-text="item.name"></p>
            <div class="flex items-center gap-2 mt-1">
              <!-- Print selector -->
              <template x-if="item.prints.length > 1">
                <select x-model="item.printId"
                        @change="onQueuePrintChange(idx)"
                        class="input text-xs py-0.5 w-auto max-w-[180px]">
                  <template x-for="p in item.prints" :key="p.id">
                    <option :value="p.id"
                            x-text="`${p.set_code} #${p.collector_number}`">
                    </option>
                  </template>
                </select>
              </template>
              <template x-if="item.prints.length === 1">
                <span class="text-xs text-gray-500 dark:text-gray-400"
                      x-text="`${item.prints[0].set_code} #${item.prints[0].collector_number}`"></span>
              </template>
            </div>
          </div>

          <!-- Cantidad -->
          <div class="flex items-center gap-1 shrink-0">
            <button type="button" @click="item.quantity = Math.max(1, item.quantity - 1)"
                    class="w-6 h-6 rounded flex items-center justify-center
                           text-gray-500 hover:bg-gray-100 dark:hover:bg-void-700">
              -
            </button>
            <input type="number" x-model.number="item.quantity" min="1"
                   class="input w-12 text-center text-sm py-0.5 px-1">
            <button type="button" @click="item.quantity++"
                    class="w-6 h-6 rounded flex items-center justify-center
                           text-gray-500 hover:bg-gray-100 dark:hover:bg-void-700">
              +
            </button>
          </div>

          <!-- Condición -->
          <select x-model="item.condition"
                  class="input text-xs py-0.5 w-auto shrink-0">
            {% for value, label in condition_choices %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>

          <!-- Finish -->
          <select x-model="item.finish"
                  class="input text-xs py-0.5 w-auto shrink-0">
            {% for value, label in finish_choices %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>

          <!-- Eliminar -->
          <button type="button" @click="queue.splice(idx, 1)"
                  class="text-gray-400 hover:text-red-500 shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </template>
    </div>

    <!-- Submit -->
    <div class="flex items-center gap-3">
      <button type="button"
              @click="submitAll()"
              :disabled="submitting"
              class="btn-primary text-sm"
              :class="{ 'opacity-50 cursor-not-allowed': submitting }">
        <span x-show="!submitting">
          Agregar <span x-text="queue.length"></span> carta(s)
        </span>
        <span x-show="submitting">Agregando...</span>
      </button>
      <p x-show="message" x-text="message"
         class="text-sm"
         :class="hasError ? 'text-red-500' : 'text-green-600 dark:text-green-400'"></p>
    </div>
  </div>
</div>

<script>
function bulkCardAdder(url, csrfToken) {
  return {
    formUrl: url,
    csrfToken: csrfToken,
    query: '',
    results: [],
    queue: [],
    submitting: false,
    message: '',
    hasError: false,

    async search() {
      if (this.query.length < 2) {
        this.results = [];
        return;
      }
      try {
        const resp = await fetch(`{% url 'tolarian:card-search' %}?q=${encodeURIComponent(this.query)}`);
        this.results = await resp.json();
      } catch (e) {
        this.results = [];
      }
    },

    addCard(card) {
      const print = card.prints.length ? card.prints[0] : null;
      this.queue.push({
        cardId: card.id,
        name: card.name,
        prints: card.prints,
        printId: print ? print.id : '',
        image: print ? print.image : '',
        quantity: 1,
        condition: 'NM',
        finish: 'nonfoil',
        language: 'en',
      });
      this.results = [];
      this.query = '';
      this.message = '';
    },

    onQueuePrintChange(idx) {
      const item = this.queue[idx];
      const p = item.prints.find(p => p.id === item.printId);
      item.image = p ? p.image : '';
    },

    async submitAll() {
      if (this.queue.length === 0 || this.submitting) return;
      this.submitting = true;
      this.message = '';
      this.hasError = false;

      const payload = this.queue.map(item => ({
        card: item.cardId,
        print: item.printId || '',
        quantity: item.quantity,
        condition: item.condition,
        finish: item.finish,
        language: item.language,
      }));

      try {
        const resp = await fetch(this.formUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': this.csrfToken,
          },
          body: JSON.stringify(payload),
        });

        const data = await resp.json();

        if (resp.ok) {
          const parts = [];
          if (data.created) parts.push(`${data.created} nueva(s)`);
          if (data.updated) parts.push(`${data.updated} actualizada(s)`);
          if (data.errors?.length) parts.push(`${data.errors.length} error(es)`);
          this.message = parts.join(', ');
          this.hasError = data.errors?.length > 0;

          // Remove successfully added items, keep errored ones
          if (data.errors?.length) {
            const errorIndices = new Set(data.errors.map(e => e.index));
            this.queue = this.queue.filter((_, i) => errorIndices.has(i));
          } else {
            this.queue = [];
          }

          // Reload page after short delay to show updated collection
          if (!this.hasError) {
            setTimeout(() => location.reload(), 800);
          }
        } else {
          this.message = data.error || 'Error al agregar cartas.';
          this.hasError = true;
        }
      } catch (e) {
        this.message = 'Error de conexión.';
        this.hasError = true;
      } finally {
        this.submitting = false;
      }
    },
  };
}
</script>
