{% load core_tags %}

{% if page_obj.object_list %}
<div class="grid gap-4"
     :style="'grid-template-columns: repeat(' + (cardSize === 'sm' ? 6 : cardSize === 'lg' ? 4 : 5) + ', minmax(0, 1fr))'"
     id="collection-grid">
  {% include "tolarian/partials/collection_grid_items.html" %}
</div>
{% else %}
<div class="card p-16 text-center text-gray-400 dark:text-gray-600">
  <p class="text-sm">
    {% if q %}No se encontraron cartas con "{{ q }}".
    {% else %}Esta colección está vacía.{% endif %}
  </p>
</div>
{% endif %}
