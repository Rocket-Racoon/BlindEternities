{% extends "base.html" %}

{% block title %}Delete listing{% endblock %}

{% block content %}
<div class="max-w-md mx-auto card p-6">
  <h1 class="text-lg font-semibold mb-2">Delete this listing?</h1>
  <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">
    {{ object.card_print.card.name }} ({{ object.get_listing_type_display }}) — this cannot be undone.
  </p>
  <form method="post" class="flex gap-2 justify-end">
    {% csrf_token %}
    <a href="{{ object.get_absolute_url }}" class="btn-secondary">Cancel</a>
    <button class="btn-primary bg-red-600 hover:bg-red-700">Delete</button>
  </form>
</div>
{% endblock %}
