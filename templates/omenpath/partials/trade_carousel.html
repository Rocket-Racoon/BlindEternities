{# Params: side ("offered"|"requested"), title, data_id #}
<div class="card p-4 mb-4">
  <div class="flex items-baseline justify-between mb-3">
    <h2 class="font-semibold">{{ title }}</h2>
    <div class="text-xs text-gray-500 flex gap-3">
      <span x-text="selectedCount('{{ side }}') + ' selected'"></span>
      <span x-show="total('{{ side }}') !== null">
        Est. <span class="font-mono" x-text="'$' + total('{{ side }}').toFixed(2)"></span>
      </span>
    </div>
  </div>

  <div x-show="cardsFor('{{ side }}').length === 0"
       class="text-sm text-gray-400 italic py-6 text-center">
    {% if side == "offered" %}
      You have no cards in a "For Trade" collection yet.
      <a href="{% url 'tolarian:collection-list' %}" class="underline text-void-500">Create or fill a tradelist</a>.
    {% else %}
      @{{ recipient.username }} has no cards in a "For Trade" collection yet.
    {% endif %}
  </div>

  <div x-show="cardsFor('{{ side }}').length > 0" class="relative">
    <button type="button"
            @click="scroll('carousel-{{ side }}', -1)"
            class="absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-void-700/90 hover:bg-void-600 text-white w-8 h-8 rounded-full shadow-lg flex items-center justify-center -ml-3">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    <button type="button"
            @click="scroll('carousel-{{ side }}', 1)"
            class="absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-void-700/90 hover:bg-void-600 text-white w-8 h-8 rounded-full shadow-lg flex items-center justify-center -mr-3">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
      </svg>
    </button>

    <div id="carousel-{{ side }}"
         class="flex overflow-x-auto gap-3 snap-x snap-mandatory scroll-smooth pb-2 px-2">
      <template x-for="item in cardsFor('{{ side }}')" :key="item.id">
        <div class="snap-start shrink-0 w-32 relative">
          <button type="button"
                  @click="toggle('{{ side }}', item)"
                  class="block w-full relative rounded-lg overflow-hidden transition-all duration-150"
                  :class="isSelected('{{ side }}', item)
                          ? 'ring-4 ring-emerald-500 shadow-lg'
                          : 'ring-1 ring-gray-200 dark:ring-void-700 opacity-90 hover:opacity-100 hover:ring-void-400'">
            <img :src="item.image" :alt="item.card_name"
                 class="w-full aspect-[5/7] object-cover bg-gray-100 dark:bg-void-800"
                 loading="lazy">
            <div x-show="isSelected('{{ side }}', item)"
                 class="absolute top-1 right-1 bg-emerald-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
            <div class="absolute top-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded font-mono">
              x<span x-text="item.quantity"></span>
            </div>
          </button>
          <div class="mt-1 text-[11px] leading-tight">
            <div class="font-medium truncate" x-text="item.card_name" :title="item.card_name"></div>
            <div class="text-gray-500 flex justify-between">
              <span x-text="item.set_code"></span>
              <span x-show="item.unit_value != null" class="font-mono"
                    x-text="'$' + (item.unit_value ?? 0).toFixed(2)"></span>
            </div>
          </div>
          <div x-show="isSelected('{{ side }}', item)" class="mt-1">
            <input type="number" min="1" :max="item.quantity"
                   :value="qtyFor('{{ side }}', item)"
                   @input="setQty('{{ side }}', item, $event.target.value)"
                   @click.stop
                   class="input w-full text-xs text-center py-1">
          </div>
        </div>
      </template>
    </div>
  </div>
</div>
