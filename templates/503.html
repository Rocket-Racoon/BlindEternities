{% extends "base.html" %}

{% block title %}Busy — Blind Eternities{% endblock %}

{% block content %}
<div class="flex flex-1 items-center justify-center px-4 py-24">
  <div class="text-center max-w-md">
    <p class="text-5xl font-bold text-indigo-400">503</p>
    <h1 class="mt-4 text-2xl font-semibold text-gray-100">The database is busy</h1>
    <p class="mt-3 text-gray-400">
      A background task (card sync or export) is running.
      Please wait a moment and try again.
    </p>
    <a href="javascript:location.reload()"
       class="mt-8 inline-block rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-indigo-500 transition">
      Retry
    </a>
  </div>
</div>
{% endblock %}
